#
# One-off: deletes the repository's deployment history (the environments
# now run with deployment: false). Runs only when this file is pushed to
# the work branch, and is removed in the next commit; never on main.
name: Delete deployment history

on:
  push:
    branches: [ccr-13c42e4c-c1153w]
    paths: [.github/workflows/deployments-cleanup.yml]

permissions: {}

jobs:
  delete:
    runs-on: ubuntu-latest
    permissions:
      deployments: write
    steps:
      - name: Mark inactive and delete every deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          api() { curl -sS --fail-with-body -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "$@"; }
          failed=0
          while :; do
            ids=$(api "https://api.github.com/repos/$REPO/deployments?per_page=100" | jq -r '.[] | "\(.id) \(.environment) \(.created_at)"')
            [ -z "$ids" ] && break
            before=$(printf '%s\n' "$ids" | wc -l)
            while read -r id env at; do
              if api -X POST "https://api.github.com/repos/$REPO/deployments/$id/statuses" -d '{"state":"inactive"}' >/dev/null &&
                 api -X DELETE "https://api.github.com/repos/$REPO/deployments/$id" >/dev/null; then
                echo "deleted $id ($env, $at)"
              else
                echo "::warning::could not delete $id ($env, $at)"; failed=$((failed + 1))
              fi
            done <<< "$ids"
            left=$(api "https://api.github.com/repos/$REPO/deployments?per_page=100" | jq length)
            # Stop when a round deleted nothing more (only failures left).
            [ "$left" -ge "$before" ] && break
          done
          echo "left: $(api "https://api.github.com/repos/$REPO/deployments?per_page=100" | jq length), failed: $failed"
          [ "$failed" -eq 0 ]
