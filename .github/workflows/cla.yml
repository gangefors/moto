#
# CLA Assistant Lite: asks every outside contributor to sign CLA.md once,
# by commenting on their pull request. Signatures are stored as JSON on the
# `cla-signatures` branch so they stay out of the main history.
name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# pull_request_target runs with write access, which is why this workflow
# never checks out or runs code from the pull request; the action only
# reads comments and writes signatures.
permissions: {}

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    permissions:
      actions: write # to re-run the check after a signature
      contents: write # to store signatures on the cla-signatures branch
      pull-requests: write # to comment on the pull request
      statuses: write # to set the CLA status
    steps:
      - name: CLA Assistant
        if: >-
          github.event_name == 'pull_request_target' ||
          (github.event.issue.pull_request &&
           (github.event.comment.body == 'recheck' ||
            github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/gangefors/moto/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          # The copyright holder and bots don't sign.
          allowlist: gangefors,dependabot[bot],github-actions[bot]
