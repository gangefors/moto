# Copyright (C) 2026 Stefan Gangefors
#
# CI for every push and pull request (see "Testing and performance" in
# CLAUDE.md):
# - core: rustfmt, clippy, the Rust tests and cargo-deny; builds the M0
#   region file from the OSM Sweden extract (cached); runs the golden routes
#   (before/after against the last main build).
# - bench: benchmarks this build against the last main build's benchmark
#   binary on the same machine, failing on a significant regression. It
#   runs beside build, so the phone's APK doesn't wait for it.
# - build: the Android app (Rust core via cargo-ndk, then Gradle), lint
#   and unit tests. No APK carries a region; the rider downloads one.
# - publish: on main, the debug APK becomes the rolling `debug-latest`
#   pre-release for the phone, once core and build pass.
#
# Only the newest push is built: a newer push cancels core, bench and
# build of the one before (on main too). Publishing is never cancelled halfway,
# as that could leave a half-made release; a waiting publish is replaced
# by a newer one.
#
# Versions follow the versions policy in CLAUDE.md: newest release that is
# at least a week old. Actions are pinned by commit SHA.
name: CI

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
      # Documentation alone never needs a build.
      - "!**/*.md"
  pull_request:
    paths:
      - "android/**"
      - "core/**"
      - ".github/workflows/android.yml"
      - ".github/scripts/**"
      # Documentation alone never needs a build.
      - "!**/*.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.98.1"
  # The OSM Sweden extract: Geofabrik's data from the openstreetmap.fr
  # mirror. Geofabrik itself now redirects GitHub's runners to plain HTTP,
  # which the download refuses (HTTPS only).
  OSM_EXTRACT_URL: https://download.openstreetmap.fr/extracts/europe/sweden-latest.osm.pbf
  CARGO_NDK_VERSION: "4.1.2"
  CARGO_DENY_VERSION: "0.20.2"
  # Must match android/app/build.gradle.kts.
  ANDROID_PACKAGES: >-
    platforms;android-37.2
    build-tools;37.0.0
    ndk;30.0.16248370

jobs:
  core:
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    name: Core
    runs-on: ubuntu-latest
    outputs:
      region-key: ${{ steps.region-key.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy,rustfmt
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Format, lint and test
        working-directory: core
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo test --workspace

      # Supply chain: RustSec advisories, AGPL-compatible licences, crates.io
      # as the only source (core/deny.toml).
      - name: Install cargo-deny
        run: cargo install cargo-deny --version "$CARGO_DENY_VERSION" --locked

      - name: Check dependencies
        working-directory: core
        run: cargo deny --locked check

      - name: Test CI scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Build moto-regionbuild
        working-directory: core
        run: cargo build --release -p moto-regionbuild

      # The debug APK carries the M0 region file for testing (production will
      # download regions; ADR-0005). It is built from the OSM Sweden
      # extract by this commit's moto-regionbuild, so it always matches the
      # core's format, and cached per ISO week and region/builder source to
      # keep the ~800 MB download to about once a week.
      - name: Region cache key
        id: region-key
        env:
          SOURCES_HASH: ${{ hashFiles('core/moto-regionbuild/src/**', 'core/moto-core/src/region/**', 'core/moto-core/src/curvature.rs', 'core/moto-core/src/geo.rs') }}
        run: echo "key=region-m0-$(date -u +%G-W%V)-$SOURCES_HASH" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: region-cache
        with:
          path: ${{ runner.temp }}/moto-region
          key: ${{ steps.region-key.outputs.key }}

      - name: Build region file
        if: steps.region-cache.outputs.cache-hit != 'true'
        run: |
          pbf="$RUNNER_TEMP/sweden-latest.osm.pbf"
          curl -sSfL --proto '=https' --retry 3 -o "$pbf" "$OSM_EXTRACT_URL"
          mkdir -p "$RUNNER_TEMP/moto-region"
          core/target/release/moto-regionbuild "$pbf" "$RUNNER_TEMP/moto-region/m0.region"
          rm "$pbf"

      # The last main build's binary gives the golden routes their
      # before/after table (saved by the benchmark job).
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bench-baseline
          key: bench-bin-main-${{ github.run_id }}
          restore-keys: bench-bin-main-

      # Route quality: the golden routes (core/moto-core/tests/golden) with
      # this build and, for the before/after table, with the last main
      # build's binary, on the same case files. A route that breaks its
      # expectations fails the build.
      - name: Golden routes
        run: |
          region="$RUNNER_TEMP/moto-region/m0.region"
          cases=core/moto-core/tests/golden
          out="$RUNNER_TEMP/golden"
          old="$RUNNER_TEMP/bench-baseline/moto-regionbuild"
          mkdir -p "$out"
          args=(--current "$out/current.json" --summary "$GITHUB_STEP_SUMMARY")
          # The old binary may not have --golden yet or may not read the
          # region or the cases; then there is no baseline this time.
          if [ -x "$old" ]; then
            "$old" --golden "$region" "$cases" --json "$out/base.json" > /dev/null 2>&1 || true
          fi
          [ -s "$out/base.json" ] && args+=(--baseline "$out/base.json")
          # Failed cases still write their figures; the script fails the step.
          core/target/release/moto-regionbuild --golden "$region" "$cases" --json "$out/current.json" || true
          python3 .github/scripts/golden_compare.py "${args[@]}"

      # Routes across borders (ADR-0009): small cuts of the Swedish,
      # Norwegian and Danish regions, each cut at its country's exact
      # border polygon, linked into one map. Cached like the M0 region.
      - name: Border regions cache key
        id: border-key
        env:
          SOURCES_HASH: ${{ hashFiles('core/moto-regionbuild/src/**', 'core/moto-core/src/region/**', 'core/moto-core/src/curvature.rs', 'core/moto-core/src/geo.rs') }}
        # v2: the Swedish cut reaches 14.0°E (room for loops east of Lund).
        run: echo "key=region-border-v2-$(date -u +%G-W%V)-$SOURCES_HASH" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: border-cache
        with:
          path: ${{ runner.temp }}/moto-border
          key: ${{ steps.border-key.outputs.key }}

      - name: Build border regions
        if: steps.border-cache.outputs.cache-hit != 'true'
        env:
          OSM_EXTRACTS: https://download.openstreetmap.fr/extracts/europe
          OSM_POLYGONS: https://polygons.openstreetmap.fr/get_poly.py
        run: |
          out="$RUNNER_TEMP/moto-border"
          mkdir -p "$out"
          cut() {
            local id=$1 short=$2 country=$3 relation=$4 bbox=$5
            local pbf="$RUNNER_TEMP/$id-latest.osm.pbf" poly="$RUNNER_TEMP/$short.poly"
            curl -sSfL --proto '=https' --retry 3 -o "$pbf" "$OSM_EXTRACTS/$id-latest.osm.pbf"
            curl -sSfL --proto '=https' --retry 3 -o "$poly" "$OSM_POLYGONS?id=$relation&params=0"
            core/target/release/moto-regionbuild "$pbf" "$out/$short.region" \
              --country "$country" --poly "$poly" --bbox "$bbox"
            rm "$pbf"
          }
          cut sweden se SE 52822 55.3,10.9,59.35,14.0
          cut norway no NO 2978650 58.9,10.6,59.4,11.8
          cut denmark dk DK 50046 55.5,12.3,55.8,13.0

      - name: Golden routes across borders
        run: |
          b="$RUNNER_TEMP/moto-border"
          out="$RUNNER_TEMP/golden"
          core/target/release/moto-regionbuild --golden "$b/se.region,$b/no.region,$b/dk.region" \
            core/moto-core/tests/golden-border --json "$out/border.json" || true
          python3 .github/scripts/golden_compare.py --current "$out/border.json" --summary "$GITHUB_STEP_SUMMARY"

  bench:
    # The synthetic benchmark (about 7 minutes) runs beside the app build,
    # so debug-latest doesn't wait for it; a significant regression still
    # turns CI red and gets fixed. A release must not ship without it
    # passing.
    name: Benchmark
    needs: core
    runs-on: ubuntu-latest
    concurrency:
      group: android-bench-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Build moto-regionbuild
        working-directory: core
        run: cargo build --release -p moto-regionbuild

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/moto-region
          key: ${{ needs.core.outputs.region-key }}
          fail-on-cache-miss: true

      # The benchmark binary of the last main build is the baseline: both
      # binaries run alternately on this machine, so differences between CI
      # machines cancel out. Only main builds write this cache; pull requests
      # can read it but not replace it.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/bench-baseline
          key: bench-bin-main-${{ github.run_id }}
          restore-keys: bench-bin-main-

      - name: Benchmark this build against the last main build
        env:
          # A Perf-Accepted trailer accepts a significant regression.
          ACCEPTED: ${{ contains(github.event.head_commit.message, 'Perf-Accepted:') || contains(github.event.pull_request.body, 'Perf-Accepted:') }}
        run: |
          region="$RUNNER_TEMP/moto-region/m0.region"
          out="$RUNNER_TEMP/bench"
          old="$RUNNER_TEMP/bench-baseline/moto-regionbuild"
          mkdir -p "$out"
          for run in 1 2; do
            # The old binary may not read a newer region format; then there
            # is no baseline this time.
            if [ -x "$old" ]; then
              "$old" --check "$region" --json "$out/base$run.json" > /dev/null || rm -f "$out/base$run.json"
            fi
            core/target/release/moto-regionbuild --check "$region" --json "$out/run$run.json"
          done
          args=(--current "$out"/run*.json --summary "$GITHUB_STEP_SUMMARY")
          baseline=("$out"/base*.json)
          [ -e "${baseline[0]}" ] && args+=(--baseline "${baseline[@]}")
          [ "$ACCEPTED" = true ] && args+=(--accepted)
          python3 .github/scripts/bench_compare.py "${args[@]}"

      - name: Keep this build's benchmark binary as the next baseline
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/bench-baseline"
          cp core/target/release/moto-regionbuild "$RUNNER_TEMP/bench-baseline/moto-regionbuild"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/bench-baseline
          key: bench-bin-main-${{ github.run_id }}

  build:
    name: Android app
    needs: core
    runs-on: ubuntu-latest
    concurrency:
      group: android-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" $ANDROID_PACKAGES > /dev/null

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-linux-android --target x86_64-linux-android
          rustup default "$RUST_VERSION"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: core

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # A stable debug key lets each new APK install over the previous one.
      # Without the secret, AGP generates a fresh key on every run.
      - name: Restore debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            ks="$RUNNER_TEMP/debug.keystore"
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$ks"
            # Read by the debug signingConfig in android/app/build.gradle.kts.
            echo "MOTO_DEBUG_KEYSTORE=$ks" >> "$GITHUB_ENV"
            # Public certificate fingerprint, used by the signer check below.
            fp=$(keytool -list -v -keystore "$ks" -storepass android \
              -alias androiddebugkey | sed -n 's/^\s*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
            echo "Debug key SHA-256: $fp"
            echo "DEBUG_KEY_SHA256=$fp" >> "$GITHUB_ENV"
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 not set; APK signed with a one-off debug key"
          fi

      - name: Build, lint and test
        working-directory: android
        # compileReleaseKotlin: the release build's do-nothing debug tools
        # (src/release) must keep matching the real ones (src/debug).
        run: ./gradlew assembleDebug lintDebug testDebugUnitTest compileReleaseKotlin

      - name: Check APK signer
        run: |
          signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p;s/^V[0-9.]* Signer: certificate SHA-256 digest: //p' | head -1)
          echo "APK signer SHA-256: $signer"
          if [ -n "${DEBUG_KEY_SHA256:-}" ] && [ "$signer" != "$DEBUG_KEY_SHA256" ]; then
            echo "::error::APK is not signed with the key from DEBUG_KEYSTORE_BASE64"
            exit 1
          fi

      - name: Keep the APK for publishing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/apk/app-debug.apk"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: ${{ runner.temp }}/apk
          key: debug-apk-${{ github.sha }}-${{ github.run_id }}

  publish:
    name: Publish debug-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the debug-latest release
    # Never cancelled once started (a half-made release); a newer waiting
    # publish replaces an older waiting one.
    concurrency:
      group: android-publish
      cancel-in-progress: false
    steps:
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apk
          key: debug-apk-${{ github.sha }}-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Publish debug-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          apk="moto-debug-${GITHUB_SHA::7}.apk"
          cp "$RUNNER_TEMP/apk/app-debug.apk" "$apk"
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest "$apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build (latest main)" \
            --notes "Debug APK built from ${GITHUB_SHA::7} on main, with the M0 region file (Skåne and surroundings) built in. Replaced on every push that touches android/ or core/."
