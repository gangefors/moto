#
# TEMPORARY (2026-09-30): recovers the debug signing key, whose only copy
# is the DEBUG_KEYSTORE_BASE64 repository secret, so it can be moved into
# the debug-signing environment. The secret is encrypted to the rider's
# one-off RSA public key below (a random AES key wrapped with RSA-OAEP)
# and only the ciphertext is printed; nothing readable reaches the log.
# Removed again as soon as the key is recovered; never merged to main.

name: Recover debug key

on:
  push:
    branches: [ccr-13c42e4c-c1153w]
    paths: [.github/workflows/recover-debug-key.yml]

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt the debug keystore to the rider's public key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          [ -n "$DEBUG_KEYSTORE_BASE64" ] || { echo "::error::secret not set"; exit 1; }
          work="$RUNNER_TEMP/recover"
          mkdir -p "$work" && cd "$work"
          cat > pub.pem <<'EOF'
          -----BEGIN PUBLIC KEY-----
          MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAspDwbB5qooFyHizq+h9r
          /6RaSxG6pJANHwtuEqIxvbAHjQwSaCfWydScLhPCJYOEyd25558yyP9mj+2xtjSA
          alf/WA9+RH1i/Cpm2bHzoiC4+oYVdRJYq4/hmX95SO1BKWbCmC/hXh1Y994HvcH1
          +aVYIS9kq8Aurb85toqLNg42IKrBmSkMWHKDZhBlpHv0R/fm2HC3STn1YxsSFWxd
          6Mj834V0eEbFIHbYpLQ4S9EoGqR81wz5FyN0qCNzZ0/N+cBmrpuyHVNVw4ruiWnp
          Zx56qqd0DJX1Eh0totXnCgr9fOj6+ZUJXjKFYNdvEX88xi13wLpm+U5BDjLZ3DTW
          kM2uH3jgj4x2dk12/DOEh4LC8nW3kGnrPaYCHs3czgpSwZlStbdeKFmiwi8TTp6i
          G9j3HszKgYYfDw0nM14jRJ+4FjpAE+R2aE0snOOv+HwIP2NOh+imbqx4e/3sgh5j
          unsMUszEHnAIiKMJ2FcOsVPsQZigKmzn8PlBouWQtftajAY5K5oh0J8laLGhLyOv
          AIxWHV7FbO2duJ6D9sTpG8aMTqiul1U4/JBmApwIPok8qgF9JzDO4Nzprm90mMCR
          TfwlUyB25INCDVonvT9azL3MNTM1PlHM9E0AY7TSq4o8/bg7LP6Rin2sh9pAimsx
          jDTXd15cgZd3o2vYqGvBqKkCAwEAAQ==
          -----END PUBLIC KEY-----
          EOF
          sed -i 's/^ *//' pub.pem
          # The public certificate fingerprint, to compare with the
          # "Debug key SHA-256" line of earlier main builds.
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 -d > ks
          fp=$(keytool -list -v -keystore ks -storepass android -alias androiddebugkey \
            | sed -n 's/^\s*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Debug key SHA-256: $fp"
          rm -f ks
          openssl rand -hex 32 > pass
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -pkeyopt rsa_padding_mode:oaep \
            -in pass -out key.bin
          printf '%s' "$DEBUG_KEYSTORE_BASE64" \
            | openssl enc -aes-256-cbc -pbkdf2 -salt -pass file:pass -out data.bin
          rm -f pass
          echo "Wrapped key: $(stat -c %s key.bin) bytes"
          echo "----- BEGIN MOTO DEBUG KEY (encrypted) -----"
          cat key.bin data.bin | base64 -w 76
          echo "----- END MOTO DEBUG KEY (encrypted) -----"
