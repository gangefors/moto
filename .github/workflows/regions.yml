#
# Builds the downloadable routing regions (ADR-0008, ADR-0009) and
# publishes them to the `regions` release: one region per country
# (Sweden, Denmark, Norway, Finland), each from its OSM extract cut at the
# country's exact border polygon, built by this commit's moto-regionbuild,
# gzip-compressed, with the signed manifest the app reads. The builder
# writes the manifest only after the core has installed every region back
# from its compressed file. Monthly for fresh map data, and by hand (for
# example after a region format change, before an app that reads the new
# format is installed). A region whose file is byte for byte the one
# already published is not uploaded again; when none changed, nothing is.
#
# Only the files of the current region format are replaced; files of older
# formats stay for older apps until removed by hand. No caches: the files
# published are built from scratch in this job.
name: Regions

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regions
  cancel-in-progress: false

env:
  RUST_VERSION: "1.98.1"
  # The OSM extracts: Geofabrik's data from the openstreetmap.fr mirror.
  # Geofabrik itself now redirects GitHub's runners to plain HTTP, which
  # the download refuses (HTTPS only).
  OSM_EXTRACTS: https://download.openstreetmap.fr/extracts/europe
  # Each country's exact border: the polygon of its OSM boundary relation,
  # unsimplified and unbuffered (params=0), so neighbours cut on the same
  # line (ADR-0009).
  OSM_POLYGONS: https://polygons.openstreetmap.fr/get_poly.py

jobs:
  publish:
    name: Build and publish regions
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write # to publish the regions release
    # Holds REGIONS_SIGNING_KEY (ADR-0008); limited to main. Only its
    # secret is used: no deployment is recorded.
    environment:
      name: regions
      deployment: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"

      - name: Build moto-regionbuild
        working-directory: core
        run: cargo build --release --locked -p moto-regionbuild

      # Before anything is downloaded or built: each country's sources (the
      # extract's ETag and date, the border polygon's SHA-256, and the
      # builder, as the git tree of core/) against those its published
      # region was built from (sources-vN.json in the release). A country
      # whose sources are all the same is not built again: its published
      # file is reused (2026-09-29).
      - name: Check the sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/regions"
          mkdir -p "$out"
          major=$(sed -n 's/^pub const VERSION_MAJOR: u16 = \([0-9]*\);/\1/p' core/moto-core/src/region/format.rs)
          test -n "$major"
          echo "$major" > "$RUNNER_TEMP/major"
          builder=$(git rev-parse HEAD:core)
          while read -r id relation; do
            poly="$RUNNER_TEMP/$id.poly"
            curl -sSfL --proto '=https' --retry 3 -o "$poly" "$OSM_POLYGONS?id=$relation&params=0"
            head=$(curl -sSfIL --proto '=https' --retry 3 "$OSM_EXTRACTS/$id-latest.osm.pbf" \
              | tr -d '\r' | awk -F': ' 'tolower($1)=="etag"||tolower($1)=="last-modified"{printf "%s|", $2}')
            echo "$id ${head}$(sha256sum "$poly" | cut -d' ' -f1)|$builder"
          done > "$RUNNER_TEMP/sources.txt" <<'EOF_LIST'
          sweden 52822
          denmark 50046
          norway 2978650
          finland 54224
          EOF_LIST
          python3 -c 'import json,sys; print(json.dumps(dict(l.split(" ", 1) for l in open(sys.argv[1]).read().split("\n") if l), indent=1, sort_keys=True))' \
            "$RUNNER_TEMP/sources.txt" > "$RUNNER_TEMP/sources-now.json"
          gh release download regions --repo "$GITHUB_REPOSITORY" --pattern "sources-v$major.json" \
            --output "$RUNNER_TEMP/sources-published.json" 2> /dev/null || true
          : > "$RUNNER_TEMP/same"
          for id in $(python3 .github/scripts/regions_changed.py --same-sources \
              "$RUNNER_TEMP/sources-published.json" "$RUNNER_TEMP/sources-now.json"); do
            if gh release download regions --repo "$GITHUB_REPOSITORY" --pattern "$id-v$major.region.gz" \
                --output "$out/$id.region.gz" 2> /dev/null; then
              echo "$id" >> "$RUNNER_TEMP/same"
            fi
          done
          echo "Sources unchanged:"; cat "$RUNNER_TEMP/same"

      # id, country, and the box nodes are read from (Norway's polygon also
      # holds Svalbard and Jan Mayen). The ETag recorded is the download's
      # own, so an extract replaced since the check is built again next
      # time.
      - name: Build the regions
        run: |
          out="$RUNNER_TEMP/regions"
          build() {
            local id=$1 country=$2 bbox=$3
            if grep -qx "$id" "$RUNNER_TEMP/same"; then
              echo "$id: sources unchanged, reusing the published region"
              return
            fi
            local pbf="$RUNNER_TEMP/$id-latest.osm.pbf" poly="$RUNNER_TEMP/$id.poly"
            curl -sSfL --proto '=https' --retry 3 -D "$RUNNER_TEMP/$id.headers" -o "$pbf" "$OSM_EXTRACTS/$id-latest.osm.pbf"
            local head
            head=$(tr -d '\r' < "$RUNNER_TEMP/$id.headers" \
              | awk -F': ' 'tolower($1)=="etag"||tolower($1)=="last-modified"{printf "%s|", $2}')
            python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); old=d[sys.argv[2]]; d[sys.argv[2]]=sys.argv[3]+old.split("|",2)[2]; json.dump(d, open(p,"w"), indent=1, sort_keys=True)' \
              "$RUNNER_TEMP/sources-now.json" "$id" "$head"
            local opts=(--country "$country" --poly "$poly")
            [ -n "$bbox" ] && opts+=(--bbox "$bbox")
            core/target/release/moto-regionbuild "$pbf" "$out/$id.region" "${opts[@]}"
            rm "$pbf"
            # -n: no file name or time in the header, so the same region
            # always compresses to the same bytes.
            gzip -9 -n "$out/$id.region"
          }
          build sweden SE ""
          build denmark DK ""
          build norway NO 57.8,4.0,71.4,31.5
          build finland FI ""

      - name: Write and check the manifest
        run: |
          out="$RUNNER_TEMP/regions"
          for id in sweden denmark norway finland; do
            gunzip -k "$out/$id.region.gz"
          done
          core/target/release/moto-regionbuild --manifest "$out/manifest.json" \
            sweden Sweden "$out/sweden.region" "$out/sweden.region.gz" \
            denmark Denmark "$out/denmark.region" "$out/denmark.region.gz" \
            norway Norway "$out/norway.region" "$out/norway.region.gz" \
            finland Finland "$out/finland.region" "$out/finland.region.gz"
          rm "$out"/*.region
          major=$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1]))["format_major"]))' "$out/manifest.json")
          mkdir -p "$out/publish"
          for id in sweden denmark norway finland; do
            mv "$out/$id.region.gz" "$out/publish/$id-v$major.region.gz"
          done
          mv "$out/manifest.json" "$out/publish/regions-v$major.json"
          cp "$RUNNER_TEMP/sources-now.json" "$out/publish/sources-v$major.json"
          ls -l "$out/publish"

      # Monthly, and only what changed: a region whose compressed file has
      # the SHA-256 the published manifest lists is the same file, and is
      # not uploaded again. Nothing changed: nothing is signed or published.
      - name: Find what changed
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/regions/publish"
          json=$(ls "$out"/regions-v*.json)
          name=$(basename "${json%.json}.manifest")
          old="$RUNNER_TEMP/published.manifest"
          if gh release download regions --repo "$GITHUB_REPOSITORY" --pattern "$name" --output "$old" 2> /dev/null; then
            python3 .github/scripts/regions_changed.py "$old" "$json" "$out" > "$RUNNER_TEMP/changed"
          else
            ls "$out"/*.region.gz | xargs -n1 basename > "$RUNNER_TEMP/changed"
          fi
          echo "Changed regions:"; cat "$RUNNER_TEMP/changed"
          if [ -s "$RUNNER_TEMP/changed" ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi

      # The app reads regions-vN.manifest: the Ed25519 signature, then the
      # manifest (ADR-0008). The key only exists in this step's memory and a
      # private temporary file, and the result is checked with the app's own
      # keys before anything is published.
      - name: Sign the manifest
        if: steps.changed.outputs.any == 'true'
        env:
          REGIONS_SIGNING_KEY: ${{ secrets.REGIONS_SIGNING_KEY }}
        run: |
          out="$RUNNER_TEMP/regions/publish"
          json=$(ls "$out"/regions-v*.json)
          signed="${json%.json}.manifest"
          if [ -z "$REGIONS_SIGNING_KEY" ]; then
            echo "::error::REGIONS_SIGNING_KEY is not set in the regions environment"
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key" "$out/manifest.sig"' EXIT
          chmod 600 "$key"
          printf '%s\n' "$REGIONS_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$json" -out "$out/manifest.sig"
          rm -f "$key"
          test "$(stat -c %s "$out/manifest.sig")" -eq 64
          cat "$out/manifest.sig" "$json" > "$signed"
          core/target/release/moto-regionbuild --check-manifest "$signed" "$json"

      - name: Publish
        if: steps.changed.outputs.any == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/regions/publish"
          if ! gh release view regions --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create regions --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --latest=false \
              --title "Routing regions" \
              --notes "Routing regions for the app (ADR-0008, ADR-0009), one per country, rebuilt monthly from OpenStreetMap data. Map data © OpenStreetMap contributors, available under the Open Database License 1.0 (https://opendatacommons.org/licenses/odbl/1-0/); the region files are built with moto-regionbuild from this repository."
          fi
          # The changed region files first, then the signed manifest that
          # lists them all.
          while read -r f; do
            gh release upload regions --repo "$GITHUB_REPOSITORY" --clobber "$out/$f"
          done < "$RUNNER_TEMP/changed"
          gh release upload regions --repo "$GITHUB_REPOSITORY" --clobber "$out"/regions-v*.manifest
          # What each region was built from, for the next run's check.
          gh release upload regions --repo "$GITHUB_REPOSITORY" --clobber "$out"/sources-v*.json
