[workspace]
resolver = "3"
members = ["moto-core", "moto-ffi", "moto-regionbuild"]

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
crc32fast = "1.5.2"
# Section export/import (M1 step 8): gzip/deflate in pure Rust (miniz_oxide).
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
memmap2 = "0.9.11"
moto-core = { path = "moto-core" }
osmpbf = "0.3.8"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Read and write .tar.gz exports in memory only (no file-system features).
tar = { version = "0.4.46", default-features = false }
# SQLite compiled into the core (ADR-0006); no extension loading.
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
thiserror = "2"
uniffi = "0.32"
# Read and write .zip exports: deflate only (no encryption, bzip2, lzma, ...).
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"
