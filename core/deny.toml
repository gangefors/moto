#
# cargo-deny: the supply-chain check for the Rust core (see Security in
# CLAUDE.md), run in CI by the core job. `cargo deny check` from core/.

[graph]
# The core ships to Android and runs on the desktop/CI for the region
# builder; nothing else is built.
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "x86_64-unknown-linux-gnu",
]
all-features = true

[advisories]
# RustSec advisories: every vulnerability, unmaintained crate (direct or
# transitive), unsound crate and yanked version fails the check. An
# exception goes in `ignore` with the advisory id and a reason.
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = [
    # memmap2 0.5.10: unchecked offsets in Mmap(Mut)::advise_range and
    # MmapMut::flush_range. Only osmpbf 0.3.8 (the newest release) pulls it
    # in, in moto-regionbuild, which never runs on the phone; osmpbf never
    # calls those functions, and neither do we (the core uses memmap2
    # 0.9.11, which has the fix). Drop this when osmpbf moves to 0.9.
    { id = "RUSTSEC-2026-0186", reason = "memmap2 0.5 via osmpbf; affected functions never called" },
]

[licenses]
# Only licences compatible with AGPL-3.0-only (ADR-0004). Copyleft
# licences beyond MPL-2.0's file-level copyleft need a decision first.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
# BSD and ISC are allowed ahead of need; not a warning when unused.
unused-allowed-license = "allow"

[licenses.private]
# Our own crates are AGPL-3.0-only and never published.
ignore = true

[bans]
# Two versions of one crate are reported, not failed: they come from
# upstream and cost only build time and size.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Crates come from crates.io only: no git dependencies, no other
# registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
