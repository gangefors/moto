[package]
name = "moto-ffi"
version = "0.1.0"
description = "UniFFI bindings for moto-core (Kotlin now, Swift later)."
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "moto_ffi"
crate-type = ["cdylib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
moto-core.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[dev-dependencies]
moto-core = { workspace = true, features = ["fixtures"] }
